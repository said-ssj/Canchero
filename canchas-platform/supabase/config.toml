# Supabase local development configuration
project_id = "canchero-local"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
max_rows = 1000

[db]
enabled = true
port = 54322
shadow_port = 54320
major_version = 16

[studio]
enabled = true
port = 54323
api_url = "http://localhost:54321"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[auth]
enabled = true
site_url = "http://localhost:4200"
additional_redirect_urls = ["http://localhost:4200/**", "http://localhost:3000/**"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_email_confirmations = false
enable_phone_confirmations = false
enable_email_change_confirmations = true
enable_phone_change_confirmations = true
email_minimum_password_length = 8
email_password_hash_algorithm = "bcrypt"
sms_max_frequency = 60
sms_otp_exp = 600
sms_otp_length = 6

[auth.external]
# google_enabled = false
# google_client_id = ""
# google_secret = ""
# apple_enabled = false
# apple_client_id = ""
# apple_secret = ""

[storage]
enabled = true
file_size_limit = "50MiB"
bucket_size_limit = "1GiB"

[functions]
enabled = true
port = 54327
verify_jwt = true
import_map = "supabase/functions/import_map.json"

[edge_runtime]
policy = "allow"

[realtime]
enabled = true
ip_version = "ipv4"
port = 54328
websocket = true

[pg_migrate]
enabled = true