name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22.22.3'
  JAVA_VERSION: '21'
  SUPABASE_VERSION: '2.99.1'

jobs:
  web:
    name: Web checks
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_ANON_KEY: ci-placeholder-anon-key
      API_URL: https://api.example.test/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck --workspace=apps/web
      - run: npm run test --workspace=apps/web -- --watch=false
      - run: npm run build --workspace=apps/web

  api:
    name: API checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - run: mvn -B -f apps/api/pom.xml verify

  edge-functions:
    name: Supabase Edge Function checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/notificaciones/index.ts supabase/functions/reservas/index.ts
      - run: deno fmt --check supabase/functions/notificaciones/index.ts supabase/functions/reservas/index.ts
