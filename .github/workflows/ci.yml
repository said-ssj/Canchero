name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  web:
    name: Frontend (Angular 22 + Node 24)
    runs-on: ubuntu-latest
    env:
      CI: true
      SUPABASE_URL: "https://ci-placeholder.supabase.co"
      SUPABASE_ANON_KEY: "ci-placeholder-anon-key-valid-format-token"
    defaults:
      run:
        working-directory: canchas-platform
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: canchas-platform/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (Static TypeScript Check)
        run: npm run lint:web

      - name: Run Web Unit Tests (Vitest)
        run: npm run test:web

      - name: Build Web Application
        run: npm run build:web

  api:
    name: Backend (Spring Boot 3.4 + Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canchas-platform/apps/api
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run Backend Tests (H2 In-Memory)
        run: ./mvnw test

      - name: Verify Package Build
        run: ./mvnw package -DskipTests
